<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#c084fc;#34d399" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#34d399;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-node {
        animation: pulse 3s infinite ease-in-out;
      }
      .scan-line {
        animation: scan 4s linear infinite;
      }
      .shield-pulse {
        animation: shieldGlow 2.5s infinite alternate ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes scan {
        0% { transform: translateX(0); opacity: 0.1; }
        50% { opacity: 0.6; }
        100% { transform: translateX(1100px); opacity: 0.1; }
      }
      @keyframes shieldGlow {
        from { filter: drop-shadow(0 0 10px #38bdf8); }
        to { filter: drop-shadow(0 0 25px #c084fc); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Cyber Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Animated Scanning Beam -->
  <rect class="scan-line" x="50" y="20" width="4" height="360" fill="#38bdf8" filter="url(#glow)" />

  <!-- Central Shield Graphic -->
  <g transform="translate(180, 200)" class="shield-pulse">
    <path d="M 0 -70 L 60 -40 L 60 20 C 60 60 0 90 0 90 C 0 90 -60 60 -60 20 L -60 -40 Z" 
          fill="none" stroke="url(#accent-grad)" stroke-width="4" />
    <path d="M 0 -50 L 40 -30 L 40 15 C 40 45 0 68 0 68 C 0 68 -40 45 -40 15 L -40 -30 Z" 
          fill="#1e1b4b" opacity="0.6" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="#34d399" filter="url(#glow)" />
    <!-- Checkmark inside shield -->
    <path d="M -6 0 L -2 4 L 6 -4" stroke="#0a0f1d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Decorative Orbit Nodes -->
  <circle cx="100" cy="100" r="6" fill="#38bdf8" opacity="0.8" />
  <line x1="100" y1="100" x2="180" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />

  <circle cx="260" cy="300" r="8" fill="#c084fc" opacity="0.8" />
  <line x1="260" y1="300" x2="180" y2="270" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />

  <circle cx="1060" cy="120" r="7" fill="#34d399" opacity="0.8" />
  <circle cx="1100" cy="280" r="9" fill="#38bdf8" opacity="0.8" />

  <!-- Main Title & Text -->
  <text x="320" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="url(#title-grad)" filter="url(#glow)">
    AWESOME SECURE SERVICE EDGE
  </text>
  
  <text x="320" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#94a3b8">
    Curated Security Ecosystem · SaaS Platforms &amp; Open-Source Architecture
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(320, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="90" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="45" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#38bdf8" text-anchor="middle">SWG</text>

    <!-- Pill 2 -->
    <rect x="102" y="0" width="90" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="147" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#c084fc" text-anchor="middle">ZTNA</text>

    <!-- Pill 3 -->
    <rect x="204" y="0" width="90" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="249" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#34d399" text-anchor="middle">CASB</text>

    <!-- Pill 4 -->
    <rect x="306" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
    <text x="348" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#fbbf24" text-anchor="middle">DLP</text>

    <!-- Pill 5 -->
    <rect x="403" y="0" width="125" height="32" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="465" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#f43f5e" text-anchor="middle">DNS Security</text>

    <!-- Pill 6 -->
    <rect x="540" y="0" width="95" height="32" rx="16" fill="#1e293b" stroke="#a7f3d0" stroke-width="1.5" />
    <text x="587" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#a7f3d0" text-anchor="middle">FWaaS</text>

    <!-- Pill 7 -->
    <rect x="647" y="0" width="75" height="32" rx="16" fill="#1e293b" stroke="#e0e7ff" stroke-width="1.5" />
    <text x="684" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#e0e7ff" text-anchor="middle">RBI</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="320" y="300" width="750" height="4" rx="2" fill="url(#title-grad)" />
</svg>
